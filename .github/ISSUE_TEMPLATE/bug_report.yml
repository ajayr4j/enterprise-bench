name: Bug report
about: Report setup, runtime, or validation problems
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Enterprise-Bench.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands and relevant output.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
  - type: input
    id: harbor
    attributes:
      label: Harbor version
      placeholder: harbor --version
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: Paste `make validate` output if available.
      render: shell
